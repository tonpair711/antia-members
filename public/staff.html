<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>店員作業｜喜翻親子感統遊戲空間</title>
<link rel="stylesheet" href="/css/style.css?v=1.1.0">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="/images/logo.jpg" alt="">
    <h1>店員作業<small>喜翻親子感統遊戲空間</small></h1>
  </div>
  <div class="user-info">
    <span id="user-name"></span>
    <button id="btn-pw">改密碼</button>
    <button id="btn-logout">登出</button>
  </div>
</header>

<div class="container">
  <div class="msg" id="msg"></div>

  <!-- 找會員 -->
  <div class="card" id="find-card">
    <h2>找會員</h2>
    <div class="row search-row">
      <input type="text" id="search-q" placeholder="手機／Email／姓名" style="flex:3">
      <button class="btn small" id="btn-search" style="flex:1">搜尋</button>
    </div>
    <button class="btn secondary" id="btn-scan">📷 掃描會員 QR Code</button>
    <div id="video-wrap">
      <video id="video" playsinline></video>
      <button class="btn small danger" id="btn-stop-scan" style="margin-top:8px">停止掃描</button>
    </div>
    <ul class="search-result" id="search-result"></ul>
  </div>

  <!-- 會員操作 -->
  <div id="member-section" style="display:none">
    <div class="member-card">
      <div class="name" id="m-name"></div>
      <div class="account" id="m-account"></div>
      <div class="bal"><span id="m-balance"></span> 點</div>
      <div class="expiring-note" id="m-expiring" style="display:none;text-align:left"></div>
      <button class="btn small secondary" id="btn-other" style="margin-top:8px">← 換一位會員</button>
    </div>

    <div class="card">
      <h2>消費累點</h2>
      <label>消費金額（元）</label>
      <input type="number" id="earn-amount" min="1" inputmode="numeric">
      <p class="preview-hint" id="earn-preview">輸入金額自動計算點數</p>
      <button class="btn" id="btn-earn">確認加點</button>
    </div>

    <div class="card">
      <h2>兌換扣點</h2>
      <label>扣除點數</label>
      <input type="number" id="redeem-points" min="1" inputmode="numeric">
      <p class="preview-hint" id="redeem-preview">輸入點數自動計算折抵金額</p>
      <button class="btn" id="btn-redeem">確認扣點</button>
    </div>

    <div class="card">
      <h2>近期交易</h2>
      <div class="table-wrap">
        <table class="stack">
          <thead><tr><th>時間</th><th>類型</th><th>點數</th><th>經手人</th></tr></thead>
          <tbody id="m-tx"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 改密碼 Modal -->
<div id="pw-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;align-items:center;justify-content:center">
  <div class="modal-box" style="background:var(--card);border-radius:12px;padding:24px;width:90%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <h3 style="margin-bottom:16px;color:var(--primary)">修改密碼</h3>
    <label>舊密碼<input type="password" id="pw-old" style="display:block;width:100%;margin-top:4px"></label>
    <label>新密碼（至少 6 字元）<input type="password" id="pw-new" style="display:block;width:100%;margin-top:4px"></label>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn" id="pw-save" style="flex:1">儲存</button>
      <button class="btn secondary" id="pw-cancel" style="flex:1">取消</button>
    </div>
  </div>
</div>

<script src="/vendor/jsQR.js"></script>
<script src="/js/api.js?v=1.1.0"></script>
<script>
if (!API.guard(['staff', 'boss', 'admin'])) throw new Error('redirect');
const msg = document.getElementById('msg');
document.getElementById('user-name').textContent = API.name;
document.getElementById('btn-logout').onclick = () => API.logout();

const pwModal = document.getElementById('pw-modal');
document.getElementById('btn-pw').onclick = () => {
  document.getElementById('pw-old').value = '';
  document.getElementById('pw-new').value = '';
  pwModal.style.display = 'flex';
};
document.getElementById('pw-cancel').onclick = () => { pwModal.style.display = 'none'; };
pwModal.addEventListener('click', e => { if (e.target === pwModal) pwModal.style.display = 'none'; });
document.getElementById('pw-save').onclick = async () => {
  try {
    await API.post('/me/password', {
      old_password: document.getElementById('pw-old').value,
      new_password: document.getElementById('pw-new').value,
    });
    pwModal.style.display = 'none';
    showMsg(msg, '密碼已更新', true);
  } catch (e) { showMsg(msg, e.message); }
};

let settings = { rate_amount: 100, rate_points: 10, redeem_value: 1 };
let currentMember = null;
API.get('/settings').then(s => { settings = s; }).catch(() => {});

// ---- 搜尋 ----
document.getElementById('btn-search').onclick = doSearch;
document.getElementById('search-q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

async function doSearch() {
  const q = document.getElementById('search-q').value.trim();
  if (!q) return;
  try {
    const data = await API.get('/members?q=' + encodeURIComponent(q));
    const ul = document.getElementById('search-result');
    if (!data.members.length) {
      ul.innerHTML = '<li style="cursor:default;color:var(--muted)">找不到會員</li>';
      return;
    }
    ul.innerHTML = data.members.map(m =>
      `<li data-id="${m.id}"><strong>${esc(m.name)}</strong><br><small>${esc(m.account || '免登入')}・最近消費 ${m.last_visit ? fmtVisit(m.last_visit) : '無'}</small></li>`).join('');
    ul.querySelectorAll('li[data-id]').forEach(li => {
      li.onclick = () => selectMember(parseInt(li.dataset.id));
    });
  } catch (e) { showMsg(msg, e.message); }
}

// ---- 掃碼 ----
let scanStream = null, scanning = false;
document.getElementById('btn-scan').onclick = async () => {
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('video');
    video.srcObject = scanStream;
    await video.play();
    document.getElementById('video-wrap').style.display = 'block';
    scanning = true;
    scanLoop();
  } catch (e) { showMsg(msg, '無法開啟相機：' + e.message); }
};
document.getElementById('btn-stop-scan').onclick = stopScan;

function stopScan() {
  scanning = false;
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  document.getElementById('video-wrap').style.display = 'none';
}

function scanLoop() {
  if (!scanning) return;
  const video = document.getElementById('video');
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height);
    if (code && code.data) {
      stopScan();
      findByAccount(code.data.trim());
      return;
    }
  }
  requestAnimationFrame(scanLoop);
}

async function findByAccount(account) {
  try {
    const data = await API.get('/members/by-account?account=' + encodeURIComponent(account));
    selectMember(data.id);
  } catch (e) { showMsg(msg, e.message); }
}

// ---- 會員操作 ----
async function selectMember(id) {
  try {
    const data = await API.get('/members/' + id);
    currentMember = data.member;
    document.getElementById('m-name').textContent = data.member.name;
    document.getElementById('m-account').textContent = data.member.account || '免登入';
    document.getElementById('m-balance').textContent = data.balance;
    const exp = document.getElementById('m-expiring');
    if (data.expiring.points > 0) {
      exp.style.display = 'block';
      exp.textContent = `${data.expiring.points} 點將於 ${fmtDateOnly(data.expiring.earliest)} 前到期`;
    } else exp.style.display = 'none';
    document.getElementById('m-tx').innerHTML = data.transactions.slice(0, 30).map(t => `
      <tr>
        <td class="cell-title">${fmtVisit(t.created_at)}</td>
        <td data-label="類型">${txTypeName(t.type)}</td>
        <td data-label="點數" class="${t.points > 0 ? 'pts-pos' : 'pts-neg'}">${t.points > 0 ? '+' : ''}${t.points}</td>
        <td data-label="經手人">${esc(t.operator_name || '—')}</td>
      </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">尚無紀錄</td></tr>';
    document.getElementById('find-card').style.display = 'none';
    document.getElementById('member-section').style.display = 'block';
    document.getElementById('earn-amount').value = '';
    document.getElementById('redeem-points').value = '';
    updatePreviews();
  } catch (e) { showMsg(msg, e.message); }
}

document.getElementById('btn-other').onclick = () => {
  document.getElementById('member-section').style.display = 'none';
  document.getElementById('find-card').style.display = 'block';
  document.getElementById('search-result').innerHTML = '';
  document.getElementById('search-q').value = '';
  currentMember = null;
};

function updatePreviews() {
  const amount = parseInt(document.getElementById('earn-amount').value) || 0;
  const pts = Math.floor(amount / settings.rate_amount) * settings.rate_points;
  document.getElementById('earn-preview').innerHTML =
    amount > 0 ? `將獲得 <strong>${pts}</strong> 點（每 ${settings.rate_amount} 元 ${settings.rate_points} 點）` : '輸入金額自動計算點數';
  const rp = parseInt(document.getElementById('redeem-points').value) || 0;
  document.getElementById('redeem-preview').innerHTML =
    rp > 0 ? `折抵 <strong>NT$${rp * settings.redeem_value}</strong>（1 點 = NT$${settings.redeem_value}）` : '輸入點數自動計算折抵金額';
}
document.getElementById('earn-amount').addEventListener('input', updatePreviews);
document.getElementById('redeem-points').addEventListener('input', updatePreviews);

document.getElementById('btn-earn').onclick = async () => {
  const amount = parseInt(document.getElementById('earn-amount').value);
  if (!amount || amount <= 0) return showMsg(msg, '請輸入正確金額');
  try {
    const data = await API.post('/points/earn', { user_id: currentMember.id, amount });
    showMsg(msg, `已加 ${data.points} 點，餘額 ${data.balance} 點`, true);
    selectMember(currentMember.id);
  } catch (e) { showMsg(msg, e.message); }
};

document.getElementById('btn-redeem').onclick = async () => {
  const points = parseInt(document.getElementById('redeem-points').value);
  if (!points || points <= 0) return showMsg(msg, '請輸入正確點數');
  if (!confirm(`確定扣 ${points} 點（折抵 NT$${points * settings.redeem_value}）？`)) return;
  try {
    const data = await API.post('/points/redeem', { user_id: currentMember.id, points });
    showMsg(msg, `已扣 ${points} 點，餘額 ${data.balance} 點`, true);
    selectMember(currentMember.id);
  } catch (e) { showMsg(msg, e.message); }
};
</script>
</body>
</html>
