<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的點數｜喜翻親子感統遊戲空間</title>
<link rel="stylesheet" href="/css/style.css?v=2.0.1">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="/images/logo.jpg" alt="">
    <h1>喜翻<small>親子感統遊戲空間</small></h1>
  </div>
  <div class="user-info">
    <span id="user-name"></span>
    <button id="btn-pw">改密碼</button>
    <button id="btn-logout">登出</button>
  </div>
</header>

<div class="container">
  <div class="msg" id="msg"></div>

  <div class="card">
    <div class="balance-big">
      <div class="num" id="balance">—</div>
      <div class="label">目前可用點數</div>
    </div>
    <div class="expiring-note" id="expiring" style="display:none"></div>
  </div>

  <div class="card">
    <h2>我的會員條碼（結帳時出示）</h2>
    <div id="qrcode"></div>
    <p style="text-align:center;color:var(--muted);font-size:.85rem" id="account-text"></p>
  </div>

  <div class="card" id="pw-card" style="display:none">
    <h2>修改密碼</h2>
    <label>舊密碼</label>
    <input type="password" id="old-pw">
    <label>新密碼（至少 6 個字元）</label>
    <input type="password" id="new-pw">
    <button class="btn" id="btn-save-pw">儲存新密碼</button>
  </div>

  <div class="card">
    <h2>點數明細</h2>
    <div class="table-wrap">
      <table class="stack">
        <thead><tr><th>時間</th><th>類型</th><th>金額</th><th>點數</th><th>到期日</th></tr></thead>
        <tbody id="tx-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/vendor/qrcode.min.js"></script>
<script src="/js/api.js?v=2.0.1"></script>
<script>
if (!API.guard(['member'])) throw new Error('redirect');
const msg = document.getElementById('msg');
document.getElementById('user-name').textContent = API.name;
document.getElementById('btn-logout').onclick = () => API.logout();
document.getElementById('btn-pw').onclick = () => {
  const c = document.getElementById('pw-card');
  c.style.display = c.style.display === 'none' ? 'block' : 'none';
};

document.getElementById('btn-save-pw').onclick = async () => {
  try {
    await API.post('/me/password', {
      old_password: document.getElementById('old-pw').value,
      new_password: document.getElementById('new-pw').value,
    });
    showMsg(msg, '密碼已更新', true);
    document.getElementById('pw-card').style.display = 'none';
  } catch (e) { showMsg(msg, e.message); }
};

async function load() {
  try {
    const data = await API.get('/me');
    document.getElementById('balance').textContent = data.balance;
    document.getElementById('account-text').textContent = data.user.account;

    new QRCode(document.getElementById('qrcode'), {
      text: data.user.account, width: 200, height: 200,
    });

    if (data.expiring.points > 0) {
      const el = document.getElementById('expiring');
      el.style.display = 'block';
      el.textContent = `⚠ ${data.expiring.points} 點將於 ${fmtDateOnly(data.expiring.earliest)} 前到期`;
    }

    document.getElementById('tx-body').innerHTML = data.transactions.map(t => `
      <tr>
        <td class="cell-title">${fmtVisit(t.created_at)}</td>
        <td data-label="類型">${txTypeName(t.type)}</td>
        <td data-label="金額">${t.type === 'earn' ? '$' + t.amount : '—'}</td>
        <td data-label="點數" class="${t.points > 0 ? 'pts-pos' : 'pts-neg'}">${t.points > 0 ? '+' : ''}${t.points}</td>
        <td data-label="到期日">${t.expires_at ? fmtDateOnly(t.expires_at) : '—'}</td>
      </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--muted)">尚無交易紀錄</td></tr>';
  } catch (e) { showMsg(msg, e.message); }
}
load();
</script>
</body>
</html>
