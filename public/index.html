<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>喜翻親子感統遊戲空間 — 會員點數</title>
<link rel="stylesheet" href="/css/style.css?v=1.3.0">
</head>
<body>
<div class="auth-page">
  <div class="auth-logo">
    <img src="/images/logo.jpg" alt="喜翻logo">
    <h1>喜翻親子感統遊戲空間</h1>
    <p>消費累點・點數折抵</p>
  </div>
  <div class="auth-box">
    <div class="msg" id="msg"></div>

    <!-- 登入 -->
    <div class="card" id="login-form">
      <h2>登入</h2>
      <label>帳號（手機號碼或 Email）</label>
      <input type="text" id="login-account" autocomplete="username">
      <label>密碼</label>
      <input type="password" id="login-password" autocomplete="current-password">
      <button class="btn" id="btn-login">登入</button>
      <p class="switch-link">還沒有帳號？<a id="to-register">立即註冊</a></p>
    </div>

    <!-- 註冊 -->
    <div class="card" id="register-form" style="display:none">
      <h2>註冊新會員</h2>
      <label>帳號（手機號碼或 Email）</label>
      <input type="text" id="reg-account" placeholder="0912345678 或 you@example.com">
      <label>姓名</label>
      <input type="text" id="reg-name">
      <label>密碼（至少 6 個字元）</label>
      <input type="password" id="reg-password" autocomplete="new-password">
      <label>確認密碼</label>
      <input type="password" id="reg-password2" autocomplete="new-password">
      <button class="btn" id="btn-register">註冊</button>
      <p class="switch-link">已有帳號？<a id="to-login">回登入</a></p>
    </div>
  </div>
</div>
<p class="site-credit">網站與系統開發：<a href="https://tonpair.com/" target="_blank" rel="noopener">對頻設計</a></p>
<img src="/images/panda.jpg" class="auth-panda" alt="">

<script src="/js/api.js?v=1.3.0"></script>
<script>
const msg = document.getElementById('msg');

// 已登入直接導向
if (API.token) location.href = API.homeFor(API.role);

document.getElementById('to-register').onclick = () => {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = 'block';
};
document.getElementById('to-login').onclick = () => {
  document.getElementById('register-form').style.display = 'none';
  document.getElementById('login-form').style.display = 'block';
};

document.getElementById('btn-login').onclick = async () => {
  try {
    const data = await API.post('/login', {
      account: document.getElementById('login-account').value,
      password: document.getElementById('login-password').value,
    });
    API.setSession(data.token, data.role, data.name);
    location.href = API.homeFor(data.role);
  } catch (e) { showMsg(msg, e.message); }
};

document.getElementById('btn-register').onclick = async () => {
  const pw = document.getElementById('reg-password').value;
  if (pw !== document.getElementById('reg-password2').value) {
    return showMsg(msg, '兩次密碼不一致');
  }
  try {
    await API.post('/register', {
      account: document.getElementById('reg-account').value,
      name: document.getElementById('reg-name').value,
      password: pw,
    });
    showMsg(msg, '註冊成功，請登入', true);
    document.getElementById('to-login').click();
    document.getElementById('login-account').value = document.getElementById('reg-account').value;
  } catch (e) { showMsg(msg, e.message); }
};

// Enter 送出
document.getElementById('login-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-login').click();
});
</script>
</body>
